name: Update Analytics lockfile

on:
  push:
    branches:
      - feature/vercel-analytics
    paths:
      - .github/workflows/update-analytics-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies and update lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Verify build
        run: |
          pnpm lint
          pnpm build
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update analytics pnpm lockfile"
          git push
